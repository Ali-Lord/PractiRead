<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="container">
      <!-- The display -->
      <div id="reader-display" class="word-box">
        <span class="placeholder">Click &#x25B6; to read.</span>
      </div>

      <div class="progress-control">
        <input type="range" id="readProgress" name="readProgress" min="0" max="100" value="0">
      </div>

      <div class="controls">
        <button id="start-btn">&#x25B6;</button>
        <button id="pause-btn">&#10074;&#10074;</button>
        <button id="info-btn">&#x2139;</button>
      </div>

      <div class="settings">
        <label for="wpd">Difficulty:</label>
        <select name="wpd" id="wpd">
          <option value="1">Easy</option>
          <option value="2">Intermediate</option>
          <option value="3">Hard</option>
        </select>
      </div>
      <div class="settings">
        <label for="wpm">Words per minute:</label>
        <input type="number" id="wpm" value="300" min="10" max="10000">
      </div>

    </div>

    <script src="../lib/browser-polyfill.min.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
